openapi: 3.1.0
info:
  title: Veritas Layer API
  version: 0.1.0
  description: >
    Local MVP API specification for the implemented `/api/mvp` routes. This
    spec documents the current reviewer and contributor demo surface in the
    landing app.
servers:
  - url: http://localhost:3000/api/mvp
    description: Local development server
  - url: https://veritaslayer.xyz/api/mvp
    description: Planned hosted MVP demo surface
tags:
  - name: MVP
paths:
  /state:
    get:
      tags: [MVP]
      summary: Read the current MVP snapshot
      responses:
        '200':
          description: Current MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /reset:
    post:
      tags: [MVP]
      summary: Reset the in-memory MVP environment
      responses:
        '200':
          description: Reset MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /connect-wallet:
    post:
      tags: [MVP]
      summary: Connect an investor wallet in the demo environment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectWalletInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /configure-asset:
    post:
      tags: [MVP]
      summary: Update the demo asset and compliance policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureAssetInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /kyc:
    post:
      tags: [MVP]
      summary: Complete the mock KYC flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockKycInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /proof:
    post:
      tags: [MVP]
      summary: Generate a proof for the selected wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProofInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /submit-proof:
    post:
      tags: [MVP]
      summary: Submit a generated proof for eligibility verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitProofInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
  /transfers:
    post:
      tags: [MVP]
      summary: Execute a compliance-gated transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteTransferInput'
      responses:
        '200':
          description: Updated MVP state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MvpSnapshot'
        '400':
          description: Transfer rejected because the request was invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ConnectWalletInput:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
    ConfigureAssetInput:
      type: object
      required:
        - name
        - symbol
        - totalSupply
        - kycRequired
        - accreditedOnly
        - allowedJurisdictions
      properties:
        name:
          type: string
        symbol:
          type: string
        totalSupply:
          type: integer
        kycRequired:
          type: boolean
        accreditedOnly:
          type: boolean
        allowedJurisdictions:
          type: array
          items:
            type: string
    MockKycInput:
      type: object
      required: [walletAddress, jurisdiction, accredited]
      properties:
        walletAddress:
          type: string
        jurisdiction:
          type: string
        accredited:
          type: boolean
    GenerateProofInput:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
    SubmitProofInput:
      type: object
      required: [proofId]
      properties:
        proofId:
          type: string
    ExecuteTransferInput:
      type: object
      required: [fromWallet, toWallet, amount]
      properties:
        fromWallet:
          type: string
        toWallet:
          type: string
        amount:
          type: integer
    MvpSnapshot:
      type: object
      description: Current MVP runtime snapshot returned by the local demo API.
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
